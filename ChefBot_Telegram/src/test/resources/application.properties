spring.application.name=ChefBot_Telegram_Test

# Desabilita o starter de Long Polling do Telegram durante a execucao de testes
spring.autoconfigure.exclude=org.telegram.telegrambots.longpolling.starter.TelegramBotStarterConfiguration

# Credenciais ficticias para injecao de dependencia @Value em testes
telegram.bot.token=123456789:TEST_BOT_TOKEN_DUMMY
telegram.bot.username=ChefBotTest
gemini.api.key=test-gemini-api-key

# Banco de dados H2 em memoria isolado para testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
